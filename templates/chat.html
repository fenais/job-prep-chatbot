{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Chatbot</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="message" placeholder="Ask a question..." value="{{ user_message }}">
        <button type="submit">Send</button>
    </form>

    {% if user_message %}
        <div class="chat-box">
            <p><strong>You:</strong> {{ user_message }}</p>
            <p><strong>Bot:</strong> {{ response }}</p>
        </div>
    {% endif %}
</div>
{% endblock %}
